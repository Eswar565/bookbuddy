{% extends 'workspace/portal/shell.html' %}{% block panel %}<section class="bb17-card"><h2>Add staff account</h2><form method="post" class="bb17-form"><div class="bb17-fields"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Initial password<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Role<select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></label></div><label class="bb17-check"><input name="is_active" value="1" type="checkbox" checked> Active account</label><button>Create staff account</button></form></section><section class="bb17-card"><h2>Manage staff access</h2>{% for a in people %}<form method="post" class="bb17-toolbar" data-confirm="Save changes to this staff member’s access?"><input type="hidden" name="id" value="{{ a.id }}"><label>Name<input name="name" value="{{ a.name }}" required></label><label>Email<input name="email" type="email" value="{{ a.email }}" required></label><label>Role<select name="role">{% for r in roles %}<option {{ 'selected' if r==a.role }}>{{ r }}</option>{% endfor %}</select></label><label class="bb17-check"><input name="is_active" type="checkbox" value="1" {{ 'checked' if a.is_active }}> Active</label><button>Save</button></form>{% endfor %}</section>{% endblock %}
