{% extends 'workspace/portal/shell.html' %}{% block panel %}<form class="bb17-toolbar"><label>Search<input name="q" value="{{ q }}"></label><label>Status<select name="status"><option value="">All</option>{% for s in ['Open','Escalated','Closed'] %}<option {{ 'selected' if s==status }}>{{ s }}</option>{% endfor %}</select></label><button>Filter</button></form><section class="bb17-card">{% for c in conversations %}<a class="bb17-row" href="/admin/support17/{{ c.id }}/"><div><strong>{{ c.subject }}</strong><small>{{ c.name }} · {{ c.category }} · {{ c.staff_name or 'Unassigned' }}</small></div><span>{{ c.status }}</span></a>{% else %}<p>No matching support conversations.</p>{% endfor %}</section>{% endblock %}
