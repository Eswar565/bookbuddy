{% extends 'site/base.html' %}
{% block title %}Admin Login · Book Buddy{% endblock %}
{% block body %}<main class="login-wrap"><div class="login-card"><p class="section-kicker">Book Buddy content desk</p><h1>Welcome back, admin.</h1><p class="section-intro">Manage books, memberships, reading circles, contests, publications and your library website in one place.</p><form method="post" action="{{ url_for('admin_login', next=next_url) }}"><input type="hidden" name="next" value="{{ next_url }}"><p><label for="email">Admin email</label><input id="email" name="email" type="email" placeholder="admin@bookbuddy.local" required></p><p><label for="password">Password</label><input id="password" name="password" type="password" required></p><button class="button button-wine" type="submit">Sign in to admin</button></form></div></main>{% endblock %}
