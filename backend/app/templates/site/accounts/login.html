{% extends 'site/base.html' %}{% block title %}Member sign in | Book Buddy{% endblock %}
{% block body %}<main class="bb16-auth"><section class="bb16-form-panel"><p class="bb16-eyebrow">MEMBER ACCESS</p><h2>Welcome back</h2><p>Sign in to manage your reading, borrowing requests, memberships and events.</p><form method="post" action="{{ url_for('account_login',next=next_url) }}"><input type="hidden" name="next" value="{{ next_url }}"><label for="signin-email">Email address</label><input id="signin-email" type="email" name="email" autocomplete="email" required><label for="signin-password">Password</label><input id="signin-password" type="password" name="password" autocomplete="current-password" required><button class="bb16-btn bb16-primary" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-key"></use></svg> Sign in</button></form><p>New to Book Buddy? <a href="{{ url_for('account_signup') }}">Create your membership account</a></p></section></main>{% endblock %}
