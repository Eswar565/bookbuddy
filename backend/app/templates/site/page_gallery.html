<section class="bb-gallery-page"><div class="bb-gallery-container"><header class="bb-gallery-header"><span class="bb-gallery-pill">Our Gallery</span><h2 class="bb-gallery-heading">{{ content.get('gallery_title', 'Capturing Moments, Creating Memories') }}</h2></header><div class="bb-gallery-card"><div class="bb-gallery-grid">{% for item in page_gallery %}<button type="button" class="bb-gallery-tile" data-gallery-tile data-full-image="{{ item.image_path }}" aria-label="Gallery photo"><img src="{{ item.image_path }}" alt="{{ item.alt_text or 'Book Buddy gallery photo' }}" width="800" height="500" loading="lazy" decoding="async"></button>{% endfor %}</div></div></div></section>
