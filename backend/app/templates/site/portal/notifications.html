{% extends 'site/portal/shell.html' %}{% block workspace %}<form method="post" action="/members/notifications/read/"><button>Mark all as read</button></form><section class="bb17-card">{% for n in items %}<article class="bb17-row"><div><strong>{{ n.title }}</strong><p>{{ n.body }}</p><small>{{ n.created_at }} · {{ 'Read' if n.is_read else 'Unread' }}</small></div><a href="{{ n.url }}">Open</a></article>{% else %}<p>You are up to date. No notifications yet.</p>{% endfor %}</section>{% endblock %}
