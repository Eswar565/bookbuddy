{% extends 'site/portal/shell.html' %}{% block workspace %}<div class="bb17-split"><section class="bb17-card"><h2>New conversation</h2><p>Messages go to real BookBuddy staff. Responses depend on staff availability.</p><form method="post" class="bb17-form"><label>Subject<input name="subject" maxlength="200" required></label><label>Team<select name="category"><option>Library</option><option>Learning</option><option>Support</option><option>Billing</option></select></label><label>How can we help?<textarea name="message" maxlength="5000" rows="6" required></textarea></label><button>Start conversation</button></form></section><section class="bb17-card"><h2>Your conversations</h2>{% for c in conversations %}<a class="bb17-row" href="/members/support/{{ c.id }}/"><strong>{{ c.subject }}</strong><span>{{ c.status }}</span></a>{% else %}<p>No conversations yet.</p>{% endfor %}</section></div>{% endblock %}
