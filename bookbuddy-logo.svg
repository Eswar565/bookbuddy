<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D98B"/>
      <stop offset="0.5" stop-color="#C9A24D"/>
      <stop offset="1" stop-color="#A9822F"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26379A"/>
      <stop offset="1" stop-color="#121C5E"/>
    </linearGradient>
  </defs>
  <!-- Emblem -->
  <circle cx="70" cy="70" r="62" fill="url(#navy)"/>
  <circle cx="70" cy="70" r="56" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Open book -->
  <path d="M70 50 C60 43 47 43 36 47 V89 C47 85 60 85 70 92 Z" fill="#FFFFFF"/>
  <path d="M70 50 C80 43 93 43 104 47 V89 C93 85 80 85 70 92 Z" fill="#F1F3FA"/>
  <path d="M70 50 V92" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Bookmark -->
  <path d="M86 44 V67 L92 61 L98 67 V45 C94 44 90 43.5 86 44 Z" fill="url(#gold)"/>
  <!-- Friendly smile (buddy) -->
  <path d="M54 102 Q70 112 86 102" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="150" y="82" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">
    <tspan fill="#1B2A7A">book </tspan><tspan fill="url(#gold)">buddy</tspan>
  </text>
  <text x="153" y="108" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#6B7280">LIBRARY MANAGER</text>
</svg>
